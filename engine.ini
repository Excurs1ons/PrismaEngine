# Prisma Engine 配置文件
# 由 PrismaLauncher 在启动时读取 (Runtime.cpp → LoadEngineConfig())
# 格式: key=value (每行一条, # 开头的行是注释)

# 引擎名称 (会在窗口标题等处显示)
Name=Prisma Engine

# 无头模式 (不创建窗口, 仅命令行运行)
# 0 = 关闭 (默认), 1 = 开启
Headless=0

# 最低日志级别
# 0 = Trace, 1 = Debug, 2 = Info, 3 = Warn, 4 = Error, 5 = Fatal
MinLogLevel=0

# 垂直同步模式
# 0 = VSync, 1 = Immediate, 2 = Mailbox
PresentMode=0

# 最大帧率上限 (0 = 不限制)
MaxFPS=0

# 启动时刷新资源数据库
# 0 = 关闭 (推荐, 避免每次启动改写 assets/metadata.json)
# 1 = 开启
RefreshAssetDatabaseOnStartup=0
