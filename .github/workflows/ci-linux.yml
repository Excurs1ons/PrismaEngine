name: CI Linux

on:
  push:
    branches: [ main, develop, dev ]
    paths:
      - 'src/**'
      - 'projects/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/ci-linux.yml'
  pull_request:
    branches: [ main, develop, dev ]
    paths:
      - 'src/**'
      - 'projects/**'
      - 'cmake/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/ci-linux.yml'
  workflow_dispatch:

env:
  CMAKE_VERSION: '4.3.2'

jobs:
  ci-linux:
    name: Linux CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libx11-dev libxrandr-dev libvulkan-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev ninja-build

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: .dependencies
        key: ${{ runner.os }}-deps-${{ hashFiles('cmake/DependencyVersions.cmake') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2.0
      with:
        cmake-version: ${{ env.CMAKE_VERSION }}

    - name: Setup Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@main
      with:
        vulkan-query-version: 1.4.304.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
        vulkan-use-cache: true

    - name: Configure CMake
      run: cmake --preset linux-x64-debug -DPRISMA_BUILD_PROJECT_NEOEDITOR=OFF -DPRISMA_BUILD_TESTING=ON -DPRISMA_BUILD_SUBSYSTEM_EDITOR=OFF

    - name: Build
      run: cmake --build build/linux-x64-debug --parallel
