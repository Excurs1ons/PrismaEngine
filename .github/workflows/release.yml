name: Release SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string

env:
  CMAKE_VERSION: '4.3.2'

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - name: Get version
      id: version
      run: |
        VERSION="${{ github.event.inputs.version }}"
        VERSION=${VERSION#v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Version: $VERSION"

  # ==========================
  # Windows x64
  # ==========================
  sdk-windows-x64:
    name: Windows x64 SDK
    runs-on: windows-latest
    needs: get-version
    steps:
    - uses: actions/checkout@v4

    - uses: jwlawson/actions-setup-cmake@v2.0
      with:
        cmake-version: ${{ env.CMAKE_VERSION }}

    - uses: humbletim/setup-vulkan-sdk@main
      with:
        vulkan-query-version: 1.4.304.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
        vulkan-use-cache: true

    - name: Build Engine
      run: |
        cmake -B build/windows-x64-release -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DPRISMA_BUILD_PROJECT_PRISMA2D=OFF -DPRISMA_BUILD_PROJECT_PATHTRACING3D=OFF -DPRISMA_BUILD_PROJECT_PRISMACRAFT=OFF -DPRISMA_BUILD_PROJECT_PACMAN=OFF
        cmake --build build/windows-x64-release --config Release --parallel

    - name: Package SDK
      run: |
        $V = "${{ needs.get-version.outputs.version }}"
        $DIR = "PrismaEngine-SDK-${V}-windows-x64"
        mkdir $DIR/lib $DIR/include $DIR/cmake -Force
        Copy-Item -Recurse sdk/include/PrismaEngine $DIR/include/
        Copy-Item sdk/cmake/*.cmake $DIR/cmake/
        Copy-Item build/windows-x64-release/bin/Release/Prisma.dll $DIR/lib/ -ErrorAction SilentlyContinue
        Copy-Item build/windows-x64-release/lib/Release/Prisma.lib $DIR/lib/ -ErrorAction SilentlyContinue
        7z a "PrismaEngine-SDK-${V}-windows-x64.zip" $DIR

    - uses: actions/upload-artifact@v4
      with:
        name: sdk-windows-x64
        path: PrismaEngine-SDK-*.zip

  # ==========================
  # Linux x64
  # ==========================
  sdk-linux-x64:
    name: Linux x64 SDK
    runs-on: ubuntu-latest
    needs: get-version
    steps:
    - uses: actions/checkout@v4

    - uses: jwlawson/actions-setup-cmake@v2.0
      with:
        cmake-version: ${{ env.CMAKE_VERSION }}

    - uses: humbletim/setup-vulkan-sdk@main
      with:
        vulkan-query-version: 1.4.304.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
        vulkan-use-cache: true

    - name: Install deps
      run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev ninja-build

    - name: Build Engine
      run: |
        cmake --preset linux-x64-release -DPRISMA_BUILD_PROJECT_PRISMA2D=OFF -DPRISMA_BUILD_PROJECT_PATHTRACING3D=OFF -DPRISMA_BUILD_PROJECT_PRISMACRAFT=OFF -DPRISMA_BUILD_PROJECT_PACMAN=OFF
        cmake --build build/linux-x64-release --parallel

    - name: Package SDK
      run: |
        V="${{ needs.get-version.outputs.version }}"
        DIR="PrismaEngine-SDK-${V}-linux-x64"
        mkdir -p $DIR/lib $DIR/include $DIR/cmake
        cp -r sdk/include/PrismaEngine $DIR/include/
        cp sdk/cmake/*.cmake $DIR/cmake/
        cp build/linux-x64-release/lib/libPrisma.so $DIR/lib/
        tar czf "PrismaEngine-SDK-${V}-linux-x64.tar.gz" $DIR

    - uses: actions/upload-artifact@v4
      with:
        name: sdk-linux-x64
        path: PrismaEngine-SDK-*.tar.gz

  # ==========================
  # Android ARM64
  # ==========================
  sdk-android-arm64:
    name: Android ARM64 SDK
    runs-on: ubuntu-latest
    needs: get-version
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - uses: nttld/setup-ndk@v1
      with:
        ndk-version: r28
        add-to-path: true

    - uses: jwlawson/actions-setup-cmake@v2.0
      with:
        cmake-version: ${{ env.CMAKE_VERSION }}

    - name: Install Ninja
      run: sudo apt-get update && sudo apt-get install -y ninja-build

    - name: Build Engine
      run: |
        cmake --preset android-arm64-release -DPRISMA_BUILD_PROJECT_PRISMA2D=OFF -DPRISMA_BUILD_PROJECT_PATHTRACING3D=OFF -DPRISMA_BUILD_PROJECT_PRISMACRAFT=OFF -DPRISMA_BUILD_PROJECT_PACMAN=OFF
        cmake --build build/android-arm64-release --parallel

    - name: Package SDK
      run: |
        V="${{ needs.get-version.outputs.version }}"
        DIR="PrismaEngine-SDK-${V}-android-arm64"
        mkdir -p $DIR/lib $DIR/include $DIR/cmake
        cp -r sdk/include/PrismaEngine $DIR/include/
        cp sdk/cmake/*.cmake $DIR/cmake/
        cp build/android-arm64-release/lib/libPrisma.so $DIR/lib/
        tar czf "PrismaEngine-SDK-${V}-android-arm64.tar.gz" $DIR

    - uses: actions/upload-artifact@v4
      with:
        name: sdk-android-arm64
        path: PrismaEngine-SDK-*.tar.gz

  # ==========================
  # Release
  # ==========================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [sdk-windows-x64, sdk-linux-x64, sdk-android-arm64]
    steps:
    - uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ needs.sdk-windows-x64.outputs.version || needs.get-version.outputs.version }}
        name: PrismaEngine SDK v${{ needs.get-version.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          sdk-windows-x64/*.zip
          sdk-linux-x64/*.tar.gz
          sdk-android-arm64/*.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
