name: Release SDK (Linux ARM64)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

env:
  CMAKE_VERSION: '3.31.0'
  DEBIAN_FRONTEND: noninteractive

jobs:
  get-version:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  release-linux-arm64-sdk:
    name: Linux ARM64 SDK
    runs-on: ubuntu-latest
    needs: get-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Build SDK in ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}":/workspace \
            -w /workspace \
            arm64v8/ubuntu:noble \
            bash -c '
              set -e
              apt-get update
              apt-get install -y cmake ninja-build git wget curl unzip \
                gcc g++ pkg-config libssl-dev libvulkan-dev vulkan-tools \
                libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
                libxi-dev libxext-dev libxkbcommon-dev \
                libwayland-dev wayland-protocols libegl-dev libgl-dev patchelf
              rm -rf build
              cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DPRISMA_BUILD_SHARED_LIBS=ON \
                -DPRISMA_BUILD_EDITOR=OFF \
                -DPRISMA_BUILD_RUNTIME=OFF \
                -DPRISMA_ENABLE_RENDER_VULKAN=ON \
                -DPRISMA_ENABLE_AUDIO_SDL3=ON \
                -DPRISMA_ENABLE_INPUT_SDL3=ON \
                -DPRISMA_USE_NATIVE_AUDIO=OFF \
                -DPRISMA_USE_NATIVE_INPUT=OFF \
                -DPRISMA_USE_FETCHCONTENT=ON
              cmake --build build --target Engine --parallel 2
            '

      - name: Package SDK
        shell: bash
        env:
          SDK_VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          set -e
          SDK_DIR="PrismaEngine-SDK-${SDK_VERSION}-linux-arm64"
          mkdir -p "$SDK_DIR/include/PrismaEngine"
          mkdir -p "$SDK_DIR/lib/linux"
          mkdir -p "$SDK_DIR/cmake"

          for subdir in app core window logger transform scene graphic input audio physics platform utils math object resource serialization threading tilemap ui config packing; do
            if [ -d "src/engine/$subdir" ]; then cp -r "src/engine/$subdir" "$SDK_DIR/include/PrismaEngine/"; fi
          done

          for h in EntryPoint.h Export.h Common.h Build.h framework.h; do
            if [ -f "src/engine/$h" ]; then cp "src/engine/$h" "$SDK_DIR/include/PrismaEngine/"; fi
          done

          cp build/lib/libPrisma.so* "$SDK_DIR/lib/linux/" 2>/dev/null || true
          cp build/lib/*.a "$SDK_DIR/lib/linux/" 2>/dev/null || true

          echo "" | base64 -d > "$SDK_DIR/cmake/PrismaEngineConfig.cmake"
          echo "" | base64 -d > "$SDK_DIR/cmake/PrismaEngineTargets.cmake"
          echo "" | base64 -d > "$SDK_DIR/include/PrismaEngine.h"

          sed -i "s/VERSIONPLACEHOLDER/$SDK_VERSION/" "$SDK_DIR/cmake/PrismaEngineConfig.cmake"
          patchelf --set-rpath '$ORIGIN/' "$SDK_DIR/lib/linux/libPrisma.so" 2>/dev/null || true

          tar -czf "PrismaEngine-SDK-${SDK_VERSION}-linux-arm64.tar.gz" "$SDK_DIR"
          echo "=== SDK Package ==="
          ls -lh "PrismaEngine-SDK-${SDK_VERSION}-linux-arm64.tar.gz"

      - name: Upload SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismaEngine-SDK-linux-arm64-${{ needs.get-version.outputs.version }}
          path: PrismaEngine-SDK-${{ needs.get-version.outputs.version }}-linux-arm64.tar.gz
          retention-days: 5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          name: PrismaEngine SDK v${{ needs.get-version.outputs.version }}
          draft: false
          prerelease: false
          files: PrismaEngine-SDK-${{ needs.get-version.outputs.version }}-linux-arm64.tar.gz
          body: |
            PrismaEngine SDK v${{ needs.get-version.outputs.version }} for Linux ARM64 (built with Docker + QEMU native ARM64)

            Contents:
            - include/PrismaEngine/ - Engine public API headers (no bundled 3rd-party)
            - lib/linux/libPrisma.so - Prebuilt engine library (ARM64)
            - cmake/ - CMake find_package configuration

            Requirements:
            - CMake 3.20+, C++20
            - Vulkan SDK (libvulkan-dev on Ubuntu/Debian)
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
