# Build NeoEditor
# Dedicated Windows-only workflow for NeoEditor (WinUI3) builds.
# Triggered manually or on changes to NeoEditor sources.
name: Build NeoEditor

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
    paths:
      - 'projects/NeoEditor/**'
      - 'src/editor/**'
  pull_request:
    branches: [ dev ]
    paths:
      - 'projects/NeoEditor/**'
      - 'src/editor/**'

env:
  CMAKE_VERSION: '4.3.2'

jobs:
  build:
    name: NeoEditor (Windows)
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2.0
      with:
        cmake-version: ${{ env.CMAKE_VERSION }}

    - name: Setup Vulkan SDK
      uses: humbletim/setup-vulkan-sdk@main
      with:
        vulkan-query-version: 1.4.304.0
        vulkan-components: Vulkan-Headers, Vulkan-Loader
        vulkan-use-cache: true

    - name: Configure CMake
      run: |
        cmake -B build/windows-x64-debug -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Debug -DPRISMA_BUILD_PROJECT_NEOEDITOR=ON -DPRISMA_BUILD_PROJECT_PRISMA2D=OFF -DPRISMA_BUILD_PROJECT_PATHTRACING3D=OFF -DPRISMA_BUILD_PROJECT_PRISMACRAFT=OFF -DPRISMA_BUILD_PROJECT_PACMAN=OFF

    - name: Build NeoEditor
      run: |
        cmake --build build/windows-x64-debug --config Debug --target NeoEditor --parallel
